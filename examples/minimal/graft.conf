# graft.conf - a minimal, working example context repo.
#
# Copy this file to the root of your own context repo and edit the two targets.
# Full reference: docs/SPEC.md section 4. Nothing in here is ever executed.

[defaults]

# Where the shared content lives, relative to this file. Each target's `source`
# is a directory under this one, named after the target unless it says otherwise.
source_root = context

# Where to look for your checkouts. Repeatable; `~` is expanded. Keep it as
# narrow as you honestly can - it is the difference between a scan that takes
# 200 ms and one that takes 20 seconds.
search_root = ~/projects
search_depth = 3

# Directories never descended into during the scan. Every dotdir except .git is
# pruned anyway, so this list is only for the big non-hidden ones.
search_prune = node_modules,vendor,target,dist,build

# Links every target inherits. Left side is relative to the target's source
# directory, right side is relative to the checkout root.
# `.` on the left means "the whole source directory".
link = . -> .github

# An existing real file or directory at a destination is moved aside, never
# deleted: dest.graft-backup.20260826T101500Z
backup = timestamp

# Add a marked block to .git/info/exclude so the link does not show up as an
# untracked file in every `git status`. Local only, never committed.
git_exclude = yes

# A destination that is already a symlink pointing somewhere outside this repo
# is someone else's business: warn and skip rather than take it over.
on_foreign_link = warn

# A checkout that cannot be found is skipped with a note, not an error. Set to
# `yes` for a machine where every target must exist, such as CI.
require = no

[target "web-app"]
description = customer-facing frontend
# Discovery strategies, tried top to bottom, first success wins. The origin URL
# is matched with a glob, after a trailing `.git` has been normalised away.
find = origin:*github.com/OWNER/web-app
find = origin:*gitlab.example.com/team/web-app
# A last-resort fallback by directory name. It must match exactly one directory.
find = dir:~/projects/web-app
# A candidate that does not contain this path is rejected, which keeps a
# same-named fork or a stale archive from being picked.
verify = package.json
# In addition to the inherited `. -> .github`:
link = CLAUDE.md -> CLAUDE.md
link = cursor-rules -> .cursor/rules

[target "api"]
description = payments API
source = api
find = origin:*github.com/OWNER/payments-api
find = dir:~/projects/payments-api
verify = go.mod
link = CLAUDE.md -> CLAUDE.md
# This target does not want the inherited .cursor/rules link. A `!` line removes
# an inherited destination; it does not delete anything on disk.
# link = !.cursor/rules

[target "workspace"]
description = the parent folder that holds every checkout, for editor-wide rules
# `parent-of:` takes the dirname of another strategy's result, so this target
# follows the web-app checkout around instead of hardcoding a path. Any strategy
# can go on the right of it.
find = parent-of:origin:*github.com/OWNER/web-app
# The parent folder is usually not a git repo at all, so there is nothing to
# exclude and nothing tracked to collide with.
git_exclude = no
confirm = yes

# [setup] entries are PRINTED after a successful `graft link` as a reminder.
# graft never runs them. That is invariant I1, and it is the reason you can
# clone someone else's context repo and run graft against it without reading
# every line of it first.
[setup "mcp-servers"]
description = install the local MCP servers (asks for your personal token)
run = setup/install-mcp.sh
